name: Build and Push Docker Image

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Download your repository code onto the runner
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step 2: Log in to DockerHub securely using your secrets
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Step 3: Set up Docker Buildx (enables modern caching features)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Step 4: Build the image and push it to DockerHub
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        # Replace 'your-dockerhub-username' and 'your-repo-name' with your actual names
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/expense-tracker:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/expense-tracker:${{ github.sha }}
        # Speeds up future builds by caching layers on GitHub
        cache-from: type=gha
        cache-to: type=gha,mode=max
